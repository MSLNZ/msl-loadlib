name: CI

on: [push, pull_request]

env:
  PY_COLORS: 1
  COLUMNS: 110
  PIP_DISABLE_PIP_VERSION_CHECK: 1

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        os: [windows-latest, ubuntu-24.04, macos-26-intel]
        architecture: [x64, x86]
        exclude:
          - os: ubuntu-24.04
            architecture: x86
          - os: macos-26-intel
            architecture: x86
        include:
          - os: ubuntu-26.04-arm
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # fetch all commits/branches
      - name: Install system dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y iproute2 g++ gfortran libgfortran5 zlib1g:i386 libstdc++6:i386 libgfortran5:i386
      - name: Set PYTHONNET_RUNTIME=coreclr (non Windows)
        if: ${{ matrix.os != 'windows-latest' }}
        run: echo "PYTHONNET_RUNTIME=coreclr" >> "$GITHUB_ENV"
      - name: Java version
        run: java -version
      - name: Set up Python ${{ matrix.python-version }} (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
      - name: Set up Python ${{ matrix.python-version }} (non Windows)
        if: ${{ matrix.os != 'windows-latest' }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install test dependencies
        run: |
          python -m pip install "comtypes;sys_platform=='win32'" py4j numpy pytest pytest-cov pytest-rerunfailures pythonnet
      - name: Build custom wheels
        run: |
          python -m pip install --upgrade hatch "virtualenv<21"
          hatch build --target custom
      - name: Install package from custom-built wheel
        run: python -m pip install --find-links dist --no-index msl-loadlib
      - name: Run tests
        run: python -m pytest --reruns 5

  lint:
    name: Lint
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false
          python-version: '3.14'
      - name: Spelling
        uses: streetsidesoftware/cspell-action@ce1816e4ce36532956ac6e983737392774b6e169 # v9.2.0
        with:
          incremental_files_only: false
      - name: Linting
        run: uv run -- ruff check --force-exclude --no-fix .
      - name: Formatting
        run: uv run -- ruff format --force-exclude --check .
      - name: Typing:BasedPyright
        run: uv run -- basedpyright .
      - name: Typing:MyPy
        run: uv run -- mypy .

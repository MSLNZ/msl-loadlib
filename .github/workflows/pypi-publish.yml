name: Build then Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build-packages:
    name: Build distribution packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Build custom wheels
        run: |
          python -m pip install --upgrade hatch
          hatch build --target custom --target sdist
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
            name: python-package-distributions
            path: dist/

  publish:
    name: Publish distributions to PyPI
    needs: build-packages
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/msl-loadlib
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
      - name: Download the stored distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
            name: python-package-distributions
            path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
